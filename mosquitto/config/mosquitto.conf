# Базовый конфиг Mosquitto
persistence true
persistence_location /mosquitto/data/

# Логирование
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Прослушивание портов
listener 1883 0.0.0.0
protocol mqtt

# Веб-сокет для мониторинга
listener 9001 0.0.0.0
protocol websockets

# Разрешаем анонимные подключения (для dev)
allow_anonymous true
