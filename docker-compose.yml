version: "3.8"

x-common-variables: &common-variables
  COMPOSE_PROFILES: ${COMPOSE_PROFILES:-dev}
  POSTGRES_DB: ${POSTGRES_DB:-zigbee_monitoring}
  POSTGRES_USER: ${POSTGRES_USER:-zigbeeser}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zigbeessword}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_SENSOR_RAW_TOPIC: ${KAFKA_SENSOR_RAW_TOPIC:-sensor-raw}
  MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mosquitto}
  MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
  MQTT_ZIGBEE2MQTT_TOPIC: ${MQTT_ZIGBEE2MQTT_TOPIC:-zigbee2mqtt/#}

services:
  # --- Базовые сервисы (всегда запускаются) ---
  postgres:
    profiles:
      - telemetry
    image: timescale/timescaledb:latest-pg16
    container_name: zigbee-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zigbee_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-zigbeeser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zigbeessword}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "7432:5432"
    healthcheck:
      start_period: 60s
      start_interval: 5s
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-zigbeeser} -d ${POSTGRES_DB:-zigbee_monitoring}",
        ]

      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zigbee-redis
    ports:
      - "7379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    profiles:
      - telemetry
    image: bitnamilegacy/kafka:3.4
    container_name: zigbee-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      #KAFKA_CFG_BROKER_ID: -1
      # === ZooKeeper mode ===
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"

      # === Автоматическое создание темы для внутренних нужд ===
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

      # === Параметры для чистого старта ===
      KAFKA_CFG_DELETE_TOPIC_ENABLE: "true"

      # === Listeners ===
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      # === Безопасность и настройки ===
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # === Очистка логов ===
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      KAFKA_CFG_LOG_RETENTION_BYTES: 10737418240
      KAFKA_CFG_LOG_CLEANER_ENABLE: "true"

      # === Для разработки ===
      KAFKA_CFG_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
      BITNAMI_DEBUG: "false"

    ports:
      - "9098:9092"

    volumes:
      #- ./kafka/data:/bitnami/kafka
      - ./kafka/logs:/opt/bitnami/kafka/logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zigbee-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    ports:
      - "2185:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./zookeeper/data:/var/lib/zookeeper/data
      - ./zookeeper/logs:/var/lib/zookeeper/log
      - ./zookeeper/datalog:/var/lib/zookeeper/datalog

  kafka-ui:
    profiles:
      - dev-ui
    image: provectuslabs/kafka-ui:latest
    container_name: zigbee-kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: zigbee-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: "DISABLED"
    depends_on:
      - kafka
      - zookeeper
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: zigbee-mosquitto
    ports:
      - "1889:1883"
      - "9009:9001"
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-h",
          "localhost",
          "-p",
          "1883",
          "-t",
          "health",
          "-m",
          "ping",
          "-k",
          "5",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  grafana:
    profiles:
      - ui
    image: grafana/grafana:10.3.3
    container_name: zigbee-grafana
    user: "472:472"
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_INSTALL_PLUGINS=
      - GF_DEFAULT_INSTANCE_NAME=Zigbee Monitoring
      # Отключаем автоматические плагины
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=*
      - GF_PLUGINS_SKIP_TLS_VERIFY=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/config/grafana.ini:/etc/grafana/grafana.ini:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- PROFILE: dev (только для разработки) ---
  sensor-simulator:
    profiles:
      - dev
    build:
      context: ./sensor_simulator
    container_name: zigbee-sensor-simulator
    environment:
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mosquitto}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      SIMULATOR_NUM_DEVICES: ${SIMULATOR_NUM_DEVICES:-5}
      SIMULATOR_UPDATE_INTERVAL: ${SIMULATOR_UPDATE_INTERVAL:-30}
      SIMULATOR_MQTT_TOPIC_PREFIX: ${SIMULATOR_MQTT_TOPIC_PREFIX:-zigbee2mqtt}
      SIMULATOR_DEVICE_TYPES: ${SIMULATOR_DEVICE_TYPES:-temperature}
    depends_on:
      - mosquitto
    command: python -m main
    volumes:
      - ./sensor_simulator:/app

  # --- PROFILE: production (для реальных устройств) ---
  kafka-producer:
    #    profiles:
    #      - telemetry
    build:
      context: ./kafka_producer
    container_name: zigbee-kafka-producer
    environment:
      <<: *common-variables
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./kafka_producer:/app

    restart: unless-stopped
    command: python -m main

  kafka-consumer:
    profiles:
      - telemetry
    build:
      context: ./kafka_consumer
    container_name: zigbee-kafka-consumer
    environment:
      <<: *common-variables
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-sensor-consumer-group}
      CONSUMER_BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-100}
      CONSUMER_BATCH_TIMEOUT: ${CONSUMER_BATCH_TIMEOUT:-5.0}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./kafka_consumer:/app
  admin-panel:
    profiles:
      - processing
    build:
      context: ./django
    container_name: zigbee-admin-panel
    environment:
      <<: *common-variables
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example12.aa}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}

    ports:
      - "8010:8000"
    volumes:
      - ./django:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import socket; s = socket.socket(); s.connect((''localhost'', 8000)); s.close()" || exit 1',
        ]

      interval: 30s
      timeout: 10s
      retries: 3
      #start_period: 30s # время на миграции и сбор статики
      start_interval: 10s
      start_period: 60s

    command: >
      sh -c "python manage.py migrate &&
            python manage.py createsuperuser --noinput || true &&
            python manage.py collectstatic --noinput &&
            python manage.py runserver 0.0.0.0:8000
            #gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
  nginx:
    profiles:
      - processing
    image: nginx:alpine
    container_name: zigbee-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./django/static:/static
      - ./django/media:/media
    restart: always

    depends_on:
      admin-panel:
        condition: service_healthy

  zigbee2mqtt:
    profiles:
      - production # Запускать только в продакшн-режиме
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    ports:
      - "8082:8080" # Веб-интерфейс
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - ./zigbee2mqtt/log:/app/log
    environment:
      - TZ=Europe/Moscow
      - MQTT_SERVER=mqtt://mosquitto:1889
    devices:
      - /dev/tty.usbserial-2130:/dev/ttyUSB0
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  grafana_data:

networks:
  default:
    name: zigbee-network
    driver: bridge
